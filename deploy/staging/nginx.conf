# ==============================================================================
# KANVTECH SERVICE MANAGEMENT — STAGING REVERSE PROXY (NGINX)
# Architecture:
#   HTTPS 443 -> /api/* -> NestJS Backend (127.0.0.1:5000)
#   HTTPS 443 -> /*     -> Next.js Frontend (127.0.0.1:3000)
# Database (PostgreSQL 5432) remains strictly internal, unexposed to WAN.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    # Rate limiting zone for public APIs
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name staging.kanvtech.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS Staging Gateway
    server {
        listen 443 ssl http2;
        server_name staging.kanvtech.com;

        # TLS Certificates (managed via Certbot / Let's Encrypt or corporate CA)
        ssl_certificate     /etc/letsencrypt/live/staging.kanvtech.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.kanvtech.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 10MB client upload limit (matches MAX_ATTACHMENT_SIZE_MB)
        client_max_body_size 12M;

        # Route /api/ to NestJS Backend API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / SSE support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 90s;
        }

        # Route all other traffic to Next.js Web Frontend
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
